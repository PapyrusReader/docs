name: Documentation checks

on:
  pull_request:
  push:
    branches: [development, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  documentation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: PapyrusReader/server
          # Includes the private profile-photo API from server PR #42.
          ref: 235fd051e2bf72283bcc6da4ecb2d1860b6ef332
          path: .server
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
          enable-cache: true
      - name: Install Graphviz
        run: sudo apt-get update && sudo apt-get install -y graphviz
      - name: Install locked documentation dependencies
        run: uv sync --locked --extra dev
      - name: Check API snapshot
        working-directory: .server
        run: |
          uv sync --locked
          uv run --locked python scripts/export_openapi.py ../_static/openapi.json --check
      - name: Build documentation
        run: make build
      - name: Validate requirement and task export
        run: make requirements
      - name: Test GitHub synchronization and task gates
        run: make test
      - uses: actions/upload-artifact@v4
        with:
          name: requirements
          path: |
            _build/needs/needs.json
            _build/work-items.json
